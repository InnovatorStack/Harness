name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-dotnet@v6
              with:
                  dotnet-version: 10.0.x
            - run: bun install --frozen-lockfile
            - run: bun run check
            - run: bun run release:check
